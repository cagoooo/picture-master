name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject BUILD_VERSION into sw.js / version.json / index.html
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_VERSION="$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
          echo "BUILD_VERSION=${BUILD_VERSION}"
          sed -i "s|__BUILD_VERSION__|${BUILD_VERSION}|g" sw.js
          sed -i "s|__BUILD_VERSION__|${BUILD_VERSION}|g" index.html
          # Rewrite version.json (preserve notes from commit subject)
          NOTES=$(git log -1 --pretty=%s | sed 's/"/\\"/g' | head -c 200)
          printf '{"version":"%s","notes":"%s","builtAt":"%s"}\n' \
            "$BUILD_VERSION" "$NOTES" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          echo "✅ Injected version: $BUILD_VERSION"

      - name: Inject Turnstile site key
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          if [ -n "$TURNSTILE_SITE_KEY" ]; then
            sed -i "s|PLACEHOLDER_NOT_CONFIGURED|${TURNSTILE_SITE_KEY}|g" index.html
            echo "✅ Turnstile site key injected"
          else
            echo "⚠️ TURNSTILE_SITE_KEY secret not set, frontend will skip Turnstile"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
